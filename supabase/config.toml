project_id = "adswish"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"

[auth.mfa]
enabled = true

[auth.external.tiktok]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.google]
# Google sign-in is configured on the CLOUD Supabase project (source of truth).
# Keys also live in .env.local; these fields are only used by `supabase start`.
enabled = true
client_id = ""
secret = ""
redirect_uri = ""
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
