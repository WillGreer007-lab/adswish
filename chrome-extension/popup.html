<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adswish Tracker</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 0.9rem; }
      h1 { font-size: 1rem; margin: 0 0 0.25rem; display: flex; align-items: center; gap: 0.4rem; }
      p { font-size: 0.8rem; opacity: 0.75; margin: 0 0 0.75rem; }
      .status { display: flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.6rem; border-radius: 0.5rem; background: rgba(127,127,127,0.12); margin-bottom: 0.75rem; }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
      .dot.red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
      .status span:last-child { font-size: 0.8rem; font-weight: 600; }
      .row { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.8rem; }
      .row b { word-break: break-all; }
      button { width: 100%; margin-top: 0.35rem; padding: 0.5rem; font-size: 0.85rem; cursor: pointer; }
      #result { margin-top: 0.6rem; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
      #token { font-family: monospace; font-size: 0.7rem; max-height: 60px; overflow: auto; }
      a { font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <h1><span>Adswish Tracker</span></h1>

    <div class="status">
      <span id="statusDot" class="dot red"></span>
      <span id="statusText">Checking…</span>
    </div>

    <p>Tracks conversions &amp; pixel heartbeats without site code.</p>

    <div class="row"><span>API base</span><b id="apiBase">—</b></div>
    <div class="row"><span>Business ID</span><b id="businessId">—</b></div>

    <div class="row" style="flex-direction: column; align-items: stretch;">
      <span>Token on this tab</span>
      <div id="token">—</div>
    </div>

    <button id="heartbeat">Send pixel heartbeat</button>
    <button id="track">Test conversion (order TEST-1, $10)</button>
    <div id="result"></div>

    <p style="margin-top: 0.75rem;"><a href="#" id="openOptions">Settings →</a></p>

    <script src="popup.js"></script>
  </body>
</html>
